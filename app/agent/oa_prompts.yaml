# OpenAI Prompts for evaluating suggestions
prompts:
  evaluate_edits:
    system_message: |
      You are a critical resume editor. Your task is to critique a set of resume edit
      suggestions for clarity, actionability, and relevance to a job description.
      Identify specific weaknesses or areas where the suggestions are too vague, generic, or inaccurate.
      Your response should be a brief, bulleted list of critique points and a final True/False value.
      True indicates passing, False indicates failing
      Possible failure scenarios: 
        - The resume indicates 5 years of experience but one of the suggested edits is
        'job description asks for 5 years of experience, only 3 years provided'.
        - The output is not a numbered list.